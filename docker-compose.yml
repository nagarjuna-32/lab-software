version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./codelock.db
    volumes:
      - ./server:/app

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: codelock
      POSTGRES_USER: codelock_user
      POSTGRES_PASSWORD: codelock_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
